name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-web-app:test .

      - name: Run Docker container
        run: docker run -d --name test-container -p 8080:80 devops-web-app:test

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop container
        run: docker stop test-container