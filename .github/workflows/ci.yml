name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: devops-web-app

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:test -o docker-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i docker-image.tar

      - name: Show secret message
        run: 'echo "Secret says: ${{ secrets.APP_MESSAGE }}"'

      - name: Run container
        run: docker run -d --name test-container -p 8080:80 ${{ env.IMAGE_NAME }}:test

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop container
        run: docker stop test-container