name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image version
        id: version
        run: |
          IMAGE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building image version: $IMAGE_TAG"

      - name: Build Docker image
        run: |
          docker build \
            -t devops-web-app:${{ steps.version.outputs.image_tag }} .

      - name: Run container
        run: |
          docker run -d \
            --name devops-web-app \
            -p 8080:80 \
            devops-web-app:${{ steps.version.outputs.image_tag }}

      - name: Test application
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Save Docker image
        run: |
          docker save \
            devops-web-app:${{ steps.version.outputs.image_tag }} \
            -o docker-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar

      - name: Show image version
        run: |
          echo "Docker image:"
          echo "devops-web-app:${{ steps.version.outputs.image_tag }}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f devops-web-app || true