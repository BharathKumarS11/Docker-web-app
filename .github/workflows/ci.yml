name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-web-app:ci .

      - name: Run container
        run: |
          docker run -d \
            --name devops-web-app \
            -p 8080:80 \
            devops-web-app:ci

      - name: Test application
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          docker rm -f devops-web-app || true