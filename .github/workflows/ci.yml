env:
  DOCKER_IMAGE_NAME: devops-web-app
  DOCKER_IMAGE_TAG: test
name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-web-app:test .

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-web-app:test .

      - name: Run container
        run: docker run -d --name test-container -p 8080:80 devops-web-app:test

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop container
        run: docker stop test-container