services:
  web:
    image: devops-web-app:1.1
    container_name: devops-web-app
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
